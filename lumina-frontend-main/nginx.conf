server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy generate to node-a (long timeout for CPU inference)
    location = /generate {
        proxy_pass http://node-a:8001/generate;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy tracker endpoints
    location /nodes/ {
        proxy_pass http://tracker:8003/nodes/;
        proxy_set_header Host $host;
    }

    location /assignments/ {
        proxy_pass http://tracker:8003/assignments/;
        proxy_set_header Host $host;
    }

    location /requests/ {
        proxy_pass http://tracker:8003/requests/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
