version: '3.8'

services:
  node-b:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn node_b:app --host 0.0.0.0 --port 8002
    environment:
      - MODEL_NAME=gpt2
      - SPLIT_LAYER=6
      - TRACKER_URL=http://${TRACKER_HOST}:8003
      - ENABLE_DYNAMIC_SPLIT=true
      - NODE_B_ID=node-b
    ports:
      - '8002:8002'
    networks:
      - lumina
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  lumina:
    driver: bridge
